name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ItHelpdesk.slnx
      - run: dotnet build ItHelpdesk.slnx --no-restore -c Release
      - name: Unit tests
        run: dotnet test tests/Helpdesk.UnitTests --no-build -c Release
      - name: Integration tests (Testcontainers PostgreSQL)
        run: dotnet test tests/Helpdesk.IntegrationTests --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: helpdesk
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet run --project src/Helpdesk.Api/Helpdesk.Api.csproj --urls http://127.0.0.1:5080 > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:5080/ && break
            sleep 3
          done
      - name: Playwright
        working-directory: frontend
        env:
          PLAYWRIGHT_PORT: '5173'
          VITE_API_URL: http://127.0.0.1:5080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e -- --workers=1
      - name: API log
        if: failure()
        run: cat api.log

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

services:
  postgres:
    image: postgres:18-alpine
    container_name: helpdesk-postgres
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: src/Helpdesk.Api/Dockerfile
    container_name: helpdesk-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=helpdesk;Username=helpdesk;Password=helpdesk
      Jwt__Issuer: it-helpdesk
      Jwt__Audience: it-helpdesk-client
      Jwt__SigningKey: it-helpdesk-development-signing-key-change-before-production-2026
      Jwt__ExpiresMinutes: 120
    ports:
      - "5080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:5080
    container_name: helpdesk-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
